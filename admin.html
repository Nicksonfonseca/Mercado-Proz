<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=7">
    <title>Mercado Proz - Administração</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
</head>

<body>
    <header class="position-relative d-flex justify-content-center align-items-center">
        <h1 id="titulo" class="text-center m-0">Adminstrar Produtos</h1>
        <a href="index.html" class="btn btn-light position-absolute end-0 me-10" id="link">Inicio</a>
    </header>
    <div id="adicionar">
        <form id="formCadastro">
            <h3 class="p-4">Adicionar Produtos</h3>
            <div class="campos">
                <div class="campo">
                    <label for="nome">Nome do Produto</label>
                    <input type="text" class="form-control" id="nome" placeholder="Ex: Arroz integral" required>
                </div>
                <div class="campo">
                    <label for="preco">Preço do Produto</label>
                    <input type="text" class="form-control" id="preco" placeholder="0.00" required>
                </div>
                <div class="campo">
                    <label for="categoria">Categoria do Produto</label>
                    <input type="text" class="form-control" id="categoria" placeholder="Ex: Mercearia" required>
                </div>
            </div>
            <div class="p-3">
                <button type="reset" id="limpar">Limpar</button>
                <button type="submit" id="enviar">+ Adicionar</button>
            </div>

        </form>
    </div>
    <div id="produtos">
        <h1>Produtos Cadastrados</h1>
        <div class="border rounded overflow-hidden">
            <table class="table table-striped table-bordered table-hover mt-3">
                <thead>
                    <th class="bg-success text-light">N°</th>
                    <th class="bg-success">Produto</th>
                    <th class="bg-success">Preço</th>
                    <th class="bg-success">Categoria</th>
                    <th class="bg-success">Ações</th>
                </thead>
                <tbody id="itens">

                </tbody>
            </table>
        </div>
    </div>
    </section>

    <script src="assets/js/scriptAdmin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <footer>
        <p class="text-center">Mercado Proz ©</p>
    </footer>
</body>

</html>
